spring:
  application:
    name: Razorpay

  datasource:
      url: jdbc:postgresql://localhost:5432/Razorpaydb
      username: postgres
      password: MyNewPassword123


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


Vault:
  master-key: wertyuiopkjhg23456789jhgfde56789ihgdfghji6543wedfgh


payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90

      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95

      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 90
